name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Seed database
        run: |
          python -m api.seed
          ls -la data/
      - name: dbt run
        working-directory: dbt_project
        env:
          DUCKDB_PATH: ../data/supply_chain.duckdb
        run: |
          echo "DUCKDB_PATH=$DUCKDB_PATH"
          dbt run --profiles-dir . --target dev
      - name: dbt test
        working-directory: dbt_project
        env:
          DUCKDB_PATH: ../data/supply_chain.duckdb
        run: dbt test --profiles-dir .
      - name: pytest
        run: pytest tests/ -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check api/ agents/ rag/ frontend/ --ignore E501,E402,F401,BLE001 || true